[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiidalab-orca"
version = "0.1.0"
description = "AiiDAlab interface for composable molecular ORCA workflows"
requires-python = ">=3.12"
dependencies = [
  "aiida-empa-orca==0.1.0",
  "aiidalab>=26.9.0",
  "ipywidgets>=8,<9",
  "nglview>=3",
  "matplotlib",
  # Rendering CLI and image options, absent from cubehandler 0.2.1 (PR #14).
  "cubehandler @ git+https://github.com/nanotech-empa/cubehandler.git@117736a5d61a3571d9f7d06054a6238d48c5a516",
  "aiidalab-widgets-base",
  # Shared cube viewer (PR #14), retaining the CDXML series (PR #12).
  "aiidalab-widgets-empa[cube] @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@1c6aedb352882f49e2637e75bef359bd452449ad",
]

[project.urls]
Home = "https://github.com/nanotech-empa/aiidalab-orca"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
