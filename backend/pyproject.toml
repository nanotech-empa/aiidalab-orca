[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiida-empa-orca"
version = "0.1.0"
description = "Composable molecular ORCA workflows for EMPA"
requires-python = ">=3.12"
dependencies = [
  "aiida-core>=2.9.2,<3",
  "aiida-orca @ git+https://github.com/ezpzbz/aiida-orca.git@36abfa6917819c3e9ff454cfa89d9fd013634d12",
  "ase",
  "PyYAML",
]

[project.optional-dependencies]
# Reviewed upstream API used by the remote Dyson executable.
dyson = ["dyson-orca-tools[cube] @ git+https://github.com/AndresOrtegaGuerrero/dyson-orca-tools.git@96658a681815faf1cf260bcb26fe712ca7715103", "scipy", "matplotlib"]

[project.scripts]
orca-dyson = "aiida_empa_orca.dyson_tools:main"
orca-tools = "aiida_empa_orca.tools:main"

[project.entry-points."aiida.calculations"]
"empa_orca.vibrations" = "aiida_empa_orca.vibrations:VibrationsCalculation"
"empa_orca.dyson_maps" = "aiida_empa_orca.maps:DysonMapsCalculation"
"empa_orca.map_figure" = "aiida_empa_orca.maps:MapFigureCalculation"
"empa_orca.dyson_export" = "aiida_empa_orca.dyson:StateExportCalculation"
"empa_orca.dyson" = "aiida_empa_orca.dyson:DysonCalculation"
"empa_orca.dyson_cubes" = "aiida_empa_orca.dyson:DysonCubesCalculation"
"empa_orca.orbital_catalog" = "aiida_empa_orca.orbital_inspection:OrbitalCatalogCalculation"
"empa_orca.casci" = "aiida_empa_orca.casci:CasciCalculation"
"empa_orca.common_orbitals" = "aiida_empa_orca.common_orbitals:CommonOrbitalsCalculation"
"empa_orca.cube_render" = "aiida_empa_orca.rendering:CubeRenderCalculation"
"empa_orca.electronic_storage" = "aiida_empa_orca.artifacts:ElectronicStorageCalculation"
"empa_orca.orbital_cubes" = "aiida_empa_orca.orbitals:OrbitalCubesCalculation"
"empa_orca.optimization" = "aiida_empa_orca.calculation:OptimizationCalculation"
"empa_orca.single_point" = "aiida_empa_orca.calculation:SinglePointCalculation"

[project.entry-points."aiida.parsers"]
"empa_orca.vibrations" = "aiida_empa_orca.vibrations:VibrationsParser"
"empa_orca.dyson_maps" = "aiida_empa_orca.maps:DysonMapsParser"
"empa_orca.map_figure" = "aiida_empa_orca.maps:MapFigureParser"
"empa_orca.dyson_cubes" = "aiida_empa_orca.dyson:DysonCubesParser"
"empa_orca.dyson_export" = "aiida_empa_orca.dyson:StateExportParser"
"empa_orca.dyson" = "aiida_empa_orca.dyson:DysonParser"
"empa_orca.orbital_catalog" = "aiida_empa_orca.orbital_inspection:OrbitalCatalogParser"
"empa_orca.casci" = "aiida_empa_orca.casci:CasciParser"
"empa_orca.common_orbitals" = "aiida_empa_orca.common_orbitals:CommonOrbitalsParser"
"empa_orca.cube_render" = "aiida_empa_orca.rendering:CubeRenderParser"
"empa_orca.electronic_storage" = "aiida_empa_orca.artifacts:ElectronicStorageParser"
"empa_orca.orbital_cubes" = "aiida_empa_orca.orbitals:OrbitalCubesParser"
"empa_orca.optimization" = "aiida_empa_orca.parser:OptimizationParser"
"empa_orca.single_point" = "aiida_empa_orca.parser:SinglePointParser"

[project.entry-points."aiida.workflows"]
"empa_orca.vibrations" = "aiida_empa_orca.vibrations:VibrationsWorkChain"
"empa_orca.dyson_export" = "aiida_empa_orca.dyson:StateExportWorkChain"
"empa_orca.dyson" = "aiida_empa_orca.dyson:DysonWorkChain"
"empa_orca.dyson_cubes" = "aiida_empa_orca.dyson:DysonCubesWorkChain"
"empa_orca.orbital_catalog" = "aiida_empa_orca.orbital_inspection:OrbitalCatalogWorkChain"
"empa_orca.common_orbital_cubes" = "aiida_empa_orca.orbital_inspection:CommonOrbitalCubesWorkChain"
"empa_orca.casci" = "aiida_empa_orca.casci:CasciWorkChain"
"empa_orca.common_orbitals" = "aiida_empa_orca.common_orbitals:CommonOrbitalsWorkChain"
"empa_orca.orbitals" = "aiida_empa_orca.orbitals:OrbitalsWorkChain"
"empa_orca.base" = "aiida_empa_orca.workchains:OptimizationBaseWorkChain"
"empa_orca.geometry" = "aiida_empa_orca.workchains:GeometryWorkChain"
"empa_orca.reference_base" = "aiida_empa_orca.reference:ReferenceBaseWorkChain"
"empa_orca.reference" = "aiida_empa_orca.reference:ReferenceWorkChain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiida_empa_orca = ["protocols/*.yaml", "scripts/*.py", "MAPS_LICENSE.txt"]
