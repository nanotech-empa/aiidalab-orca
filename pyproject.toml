[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiidalab-orca"
version = "0.1.0"
description = "AiiDAlab interface for composable molecular ORCA workflows"
requires-python = ">=3.12"
dependencies = [
  "aiida-empa-orca==0.1.0",
  "aiidalab>=26.9.0",
  "ipywidgets>=8,<9",
  "anywidget",
  "nglview>=3",
  "matplotlib",
  # Shared IR/Raman spectra and WEAS mode animation, including atom participation (PR #189).
  "aiidalab-qe-vibroscopy @ git+https://github.com/aiidalab/aiidalab-qe-vibroscopy.git@8d5d9c51192dbd2bf8dcf585c6ae1a8ca23ab6b4",
  # Merged canonical rendering CLI, including JSON tuple/list normalization.
  "cubehandler @ git+https://github.com/nanotech-empa/cubehandler.git@51cd2bc0349ef2eae404592ff167078d416b01ec",
  "aiidalab-widgets-base==3.0.1",
  # Merged shared viewer/CDXML, slice alignment and .cube tempfile contract.
  "aiidalab-widgets-empa[cube] @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8a97ed1ab7b448217ec165df3a3ba48a7495e9dc",
]

[project.entry-points."aiidalab_assistant.workflow_guides"]
orca = "aiidalab_orca.energy_guidance:combined_workflow_guides"

[project.urls]
Home = "https://github.com/nanotech-empa/aiidalab-orca"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiidalab_orca = ["static/*.js", "knowledge/*.md", "data/*.fcidump"]

[tool.pytest.ini_options]
testpaths = ["tests"]
