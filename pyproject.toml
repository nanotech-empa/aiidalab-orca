[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiidalab-orca"
version = "0.1.0"
description = "AiiDAlab interface for composable molecular ORCA workflows"
requires-python = ">=3.12"
dependencies = [
  "aiida-empa-orca==0.1.0",
  "aiidalab>=26.9.0",
  "ipywidgets>=8,<9",
  "anywidget",
  "nglview>=3",
  "matplotlib",
  # Shared IR/Raman spectra and WEAS mode animation, including atom participation (PR #189).
  "aiidalab-qe-vibroscopy @ git+https://github.com/aiidalab/aiidalab-qe-vibroscopy.git@8d5d9c51192dbd2bf8dcf585c6ae1a8ca23ab6b4",
  # Rendering CLI and image options, absent from cubehandler 0.2.1 (PR #14).
  "cubehandler @ git+https://github.com/nanotech-empa/cubehandler.git@926372d5480a9fec1de021dcf7149e5a2a022290",
  "aiidalab-widgets-base",
  # Shared cube viewer (PR #14), retaining the CDXML series (PR #12).
  "aiidalab-widgets-empa[cube] @ git+https://github.com/nanotech-empa/aiidalab-widgets-empa.git@8fe3b96577170efe2710ae58798bc97b9d4c39ae",
]

[project.urls]
Home = "https://github.com/nanotech-empa/aiidalab-orca"

[project.entry-points."aiidalab_assistant.workflow_guides"]
orca_xps = "aiidalab_orca.xps_guidance:workflow_guides"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiidalab_orca = ["static/*.js", "knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
