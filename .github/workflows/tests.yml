name: Geometry tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'backend[dyson]' -e . pytest 'aiida-core==2.9.2' 'aiidalab==26.9.0'
      - run: python -m pip check
      - run: python -m pytest tests -q
        env:
          AIIDA_PATH: ${{ runner.temp }}/orca-test-state
